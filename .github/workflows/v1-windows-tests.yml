name: V1 Windows PowerShell Tests

on:
  push:
    branches:
      - dev/v1-smart-layout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-integration:
    name: Windows PowerShell 5.1 integration
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows PowerShell version
        shell: powershell
        run: |
          $PSVersionTable

      - name: Run V1 integration tests
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          .\tests\Run-V1-Tests.ps1
